<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Chefs Weekly - Recipe Planner for Kids</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Little Chefs Weekly</h1>
      <p class="subtitle">30-Minute Recipes for Adventurous Little Eaters (Ages 2-4)</p>
    </div>
    <div class="header-actions">
      <button id="btn-share" class="btn btn-outline" title="Copy shareable link">Share</button>
      <button id="btn-download-pdf" class="btn btn-primary">Download PDF</button>
    </div>
  </header>

  <nav class="week-nav">
    <button id="btn-prev-week" class="btn btn-icon">&larr;</button>
    <h2 id="week-label">Week 1</h2>
    <button id="btn-next-week" class="btn btn-icon">&rarr;</button>
    <div class="nav-extras">
      <span class="week-date" id="week-date-range"></span>
      <button id="btn-regenerate" class="btn btn-small">Regenerate Week</button>
    </div>
  </nav>

  <main>
    <section class="tabs">
      <button class="tab active" data-tab="meal-plan">Meal Plan</button>
      <button class="tab" data-tab="grocery-list">Grocery Lists</button>
    </section>

    <div id="tab-meal-plan" class="tab-content active">
      <div class="meal-plan-grid" id="meal-plan-grid">
        <!-- Generated by JS -->
      </div>
    </div>

    <div id="tab-grocery-list" class="tab-content">
      <div class="grocery-controls">
        <button id="btn-download-grocery-pdf" class="btn btn-primary btn-small">Download Grocery PDF</button>
      </div>
      <div class="grocery-stores" id="grocery-stores">
        <!-- Generated by JS -->
      </div>
    </div>
  </main>

  <!-- Recipe Detail Modal -->
  <div id="recipe-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <div id="recipe-detail"></div>
    </div>
  </div>

  <!-- Share Toast -->
  <div id="toast" class="toast hidden">Link copied to clipboard!</div>

  <footer>
    <p>Little Chefs Weekly &mdash; Ingredients sourced from Little Farms, Talula Farms &amp; Zairyo, Singapore</p>
  </footer>

  <script src="recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
